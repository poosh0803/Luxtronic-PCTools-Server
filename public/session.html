<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Luxtronic PCTools -- Session Detail</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%96%A5%EF%B8%8F</text></svg>" />
  <link rel="stylesheet" href="/css/style.css" />
  <script>
    // Applies the remembered theme (default: light) before first paint, so there's no flash of
    // the wrong theme while style.css/theme.js load. Deliberately does NOT look at
    // prefers-color-scheme -- dark mode here is opt-in via the toggle button only.
    document.documentElement.setAttribute(
      'data-theme',
      localStorage.getItem('luxtronic-theme') === 'dark' ? 'dark' : 'light'
    );
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">L</span>
      <h1>Luxtronic PCTools</h1>
    </div>
    <div class="topbar-right">
      <a href="/index.html">&larr; All sessions</a>
      <button type="button" class="theme-toggle" id="theme-toggle">🌙 Dark</button>
    </div>
  </header>
  <main>
    <div id="error" class="error-banner" style="display:none"></div>

    <div class="panel session-meta" id="session-meta">
      <h2>Session</h2>
      <p class="empty-state">Loading...</p>
    </div>

    <div class="actions-row">
      <a id="pdf-link" class="button" href="#" target="_blank" rel="noopener">
        <button type="button">Download PDF report</button>
      </a>
      <button type="button" class="secondary" id="refresh-btn">Refresh</button>
      <button type="button" class="stop-btn" id="stop-session-btn" style="display:none">Stop running test(s)</button>
    </div>

    <div id="test-runs"></div>
  </main>

  <script src="/vendor/chart.umd.min.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/theme.js"></script>
</body>
</html>
