<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Luxtronic PCTools -- Session Detail</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%96%A5%EF%B8%8F</text></svg>" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <script>try { if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode'); } catch (e) {}</script>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">L</span>
      <h1>Luxtronic PCTools</h1>
      <span class="tagline">Hardware test dashboard</span>
    </div>
    <button type="button" class="dark-toggle" id="darkModeToggle" aria-label="Toggle dark mode"><i class="fas fa-moon" id="themeIcon"></i></button>
  </header>
  <nav class="nav-bar">
    <a class="nav-item" href="/index.html"><i class="fas fa-gauge-high"></i> Sessions</a>
    <a class="nav-item" href="/technicians.html"><i class="fas fa-users"></i> Technicians</a>
  </nav>
  <main>
    <div id="error" class="error-banner" style="display:none"></div>

    <div class="panel session-meta" id="session-meta">
      <h2>Session</h2>
      <p class="empty-state">Loading...</p>
    </div>

    <div class="panel" id="system-info" style="display:none"></div>

    <div class="actions-row">
      <a id="pdf-link" class="button" href="#" target="_blank" rel="noopener">
        <button type="button">Download PDF report</button>
      </a>
      <button type="button" class="secondary" id="refresh-btn">Refresh</button>
      <button type="button" class="stop-btn" id="stop-session-btn" style="display:none">Stop running test(s)</button>
    </div>

    <div id="test-runs"></div>
  </main>

  <script src="/vendor/chart.umd.min.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/theme.js"></script>
</body>
</html>
