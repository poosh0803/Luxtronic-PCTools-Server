<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Luxtronic PCTools -- Sessions</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%96%A5%EF%B8%8F</text></svg>" />
  <link rel="stylesheet" href="/css/style.css" />
  <script>
    // Applies the remembered theme (default: light) before first paint, so there's no flash of
    // the wrong theme while style.css/theme.js load. Deliberately does NOT look at
    // prefers-color-scheme -- dark mode here is opt-in via the toggle button only.
    document.documentElement.setAttribute(
      'data-theme',
      localStorage.getItem('luxtronic-theme') === 'dark' ? 'dark' : 'light'
    );
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">L</span>
      <h1>Luxtronic PCTools</h1>
    </div>
    <div class="topbar-right">
      <span class="muted">Test session dashboard</span>
      <button type="button" class="theme-toggle" id="theme-toggle">🌙 Dark</button>
    </div>
  </header>
  <main>
    <div class="panel">
      <h2>Search sessions</h2>
      <form class="filters" id="filter-form">
        <label>PC serial
          <input type="text" name="mobo_serial" placeholder="mobo serial contains..." />
        </label>
        <label>Customer
          <input type="text" name="customer_name" placeholder="customer name contains..." />
        </label>
        <label>From
          <input type="date" name="from" />
        </label>
        <label>To
          <input type="date" name="to" />
        </label>
        <button type="submit">Search</button>
        <button type="button" class="secondary" id="clear-filters">Clear</button>
      </form>
    </div>

    <div class="panel">
      <h2>Sessions</h2>
      <div id="error" class="error-banner" style="display:none"></div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Started</th>
              <th>PC serial</th>
              <th>Customer</th>
              <th>Type</th>
              <th>Technician</th>
              <th>Tests</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="sessions-body">
            <tr><td colspan="7" class="empty-state">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="/js/theme.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
