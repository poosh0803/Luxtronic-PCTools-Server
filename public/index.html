<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Luxtronic PCTools -- Sessions</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" type="image/png" href="/img/emblem.png">
</head>
<body>
  <script>try { if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode'); } catch (e) {}</script>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><img src="/img/emblem.png" alt="Luxtronic"></span>
      <h1>Luxtronic PCTools</h1>
      <span class="tagline">Hardware test dashboard</span>
    </div>
    <button type="button" class="dark-toggle" id="darkModeToggle" aria-label="Toggle dark mode"><i class="fas fa-moon" id="themeIcon"></i></button>
  </header>
  <nav class="nav-bar">
    <a class="nav-item" href="/index.html"><i class="fas fa-gauge-high"></i> Sessions</a>
    <a class="nav-item" href="/apps.html"><i class="fas fa-box-archive"></i> Apps</a>
    <a class="nav-item" href="/drivers.html"><i class="fas fa-microchip"></i> Drivers</a>
    <a class="nav-item" href="/tools.html"><i class="fas fa-screwdriver-wrench"></i> Tools</a>
    <a class="nav-item" href="/technicians.html"><i class="fas fa-users"></i> Technicians</a>
  </nav>
  <main>
    <div class="panel">
      <h2>Search sessions</h2>
      <form class="filters" id="filter-form">
        <label>PC serial
          <input type="text" name="mobo_serial" placeholder="mobo serial contains..." />
        </label>
        <label>Customer
          <input type="text" name="customer_name" placeholder="customer name contains..." />
        </label>
        <label>From
          <input type="date" name="from" />
        </label>
        <label>To
          <input type="date" name="to" />
        </label>
        <button type="submit">Search</button>
        <button type="button" class="secondary" id="clear-filters">Clear</button>
      </form>
    </div>

    <div class="panel">
      <h2>Sessions</h2>
      <div id="error" class="error-banner" style="display:none"></div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Started</th>
              <th>PC serial</th>
              <th>Customer</th>
              <th>Type</th>
              <th>Technician</th>
              <th>Tests</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="sessions-body">
            <tr><td colspan="7" class="empty-state">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="/js/theme.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
